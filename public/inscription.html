<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAFF | Inscription</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/header.js"></script>
  <script defer src="/js/footer.js"></script>
  <script defer src="/js/i18n.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero" id="page-hero">
    <div class="hero-bg-image" id="hero-bg-image"></div>
    <div class="container">
      <div class="eyebrow" data-i18n="registration_eyebrow">Participation</div>
      <h1 data-i18n="registration_title">Espace inscription</h1>
      <p class="lead" data-i18n="registration_intro">Inscrivez-vous aux activités et programmes de FAFF.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="card" style="overflow:hidden; max-width: 800px; margin: 0 auto;">
        <div class="card-body">
          <form id="inscription-form">
            <div class="form-row">
              <div>
                <label data-i18n="registration_name">Nom complet</label>
                <input type="text" name="nom" required placeholder="Jean Dupont">
              </div>
              <div>
                <label data-i18n="registration_email">Email</label>
                <input type="email" name="email" required placeholder="jean@example.com">
              </div>
            </div>

            <div class="form-row">
              <div>
                <label data-i18n="registration_phone">Téléphone</label>
                <input type="tel" name="telephone" placeholder="(123) 456-7890">
              </div>
              <div>
                <label data-i18n="registration_program">Programme / Événement</label>
                <select name="programme" required id="programme-select">
                  <option value="" data-i18n="registration_choose_program">Choisir un programme ou événement</option>
                  <option value="Renforcement des liens familiaux" data-i18n="program_family">Renforcement des liens familiaux</option>
                  <option value="Repère des Pères" data-i18n="program_fathers">Repère des Pères</option>
                  <option value="Mamans & Savoirs" data-i18n="program_mothers">Mamans & Savoirs</option>
                  <option value="Football en Français" data-i18n="program_soccer">Football en Français</option>
                  <option value="Franc'Ô Talent" data-i18n="program_talent">Franc'Ô Talent</option>
                  <option value="Médiation famille-école" data-i18n="program_mediation">Médiation famille-école</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div>
                <label data-i18n="registration_date">Date souhaitée</label>
                <input type="date" name="date_souhaitee">
              </div>
              <div>
                <label data-i18n="registration_preferred_lang">Langue préférée</label>
                <select name="langue">
                  <option value="fr" data-i18n="lang_french">Français</option>
                  <option value="en" data-i18n="lang_english">English</option>
                </select>
              </div>
            </div>

            <div>
              <label data-i18n="registration_infos">Informations complémentaires</label>
              <textarea name="infos" rows="4" placeholder="Questions, besoins particuliers, etc."></textarea>
            </div>

            <div style="margin-top: 20px;">
              <button class="btn btn-primary" type="submit" data-i18n="registration_submit">Soumettre ma candidature</button>
              <button class="btn btn-outline" type="reset" data-i18n="registration_reset" style="margin-left: 12px;">Effacer</button>
            </div>
            
            <div id="inscription-message" style="margin-top: 20px; font-weight: 500; padding: 12px; border-radius: 12px; display: none;"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<style>
  .page-hero {
    padding: 120px 0 80px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0a3528 0%, #1a5a45 100%);
    min-height: 400px;
    display: flex;
    align-items: center;
  }

  .hero-bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.2;
    z-index: 0;
  }

  .page-hero .container {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .page-hero .eyebrow {
    color: #e76f51;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 16px;
    display: inline-block;
  }

  .page-hero h1 {
    color: white;
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .page-hero .lead {
    color: rgba(255,255,255,0.95);
    font-size: 1.2rem;
    max-width: 700px;
    margin: 0 auto;
    text-shadow: 0 1px 5px rgba(0,0,0,0.2);
  }

  .card {
    max-width: 800px;
    margin: 0 auto;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #0a3528;
    font-size: 0.9rem;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    background: white;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #e76f51;
    box-shadow: 0 0 0 3px rgba(231,111,81,0.1);
  }

  .btn-outline {
    background: transparent;
    border: 2px solid #e2e8f0;
    color: #4a5568;
  }

  .btn-outline:hover {
    background: #f7fafc;
    border-color: #cbd5e0;
    transform: none;
  }

  .info-message {
    margin-top: 8px;
    font-size: 0.8rem;
    background-color: #fef9e6;
    padding: 8px 12px;
    border-radius: 8px;
    color: #e76f51;
  }

  @media (max-width: 900px) {
    .page-hero {
      padding: 100px 0 60px;
    }
    .page-hero h1 {
      font-size: 2.5rem;
    }
  }

  @media (max-width: 800px) {
    .page-hero {
      padding: 80px 0 50px;
    }
    .page-hero h1 {
      font-size: 2rem;
    }
    .page-hero .lead {
      font-size: 1rem;
    }
    .form-row {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    button[type="reset"] {
      margin-left: 0 !important;
      margin-top: 10px;
    }
  }
</style>

<script>
  // ========== TRADUCTIONS COMPLÈTES ==========
  const inscriptionTranslations = {
    fr: {
      registration_eyebrow: "Participation",
      registration_title: "Espace inscription",
      registration_intro: "Inscrivez-vous aux activités et programmes de FAFF.",
      registration_name: "Nom complet",
      registration_email: "Email",
      registration_phone: "Téléphone",
      registration_program: "Programme / Événement",
      registration_choose_program: "Choisir un programme ou événement",
      registration_date: "Date souhaitée",
      registration_preferred_lang: "Langue préférée",
      registration_infos: "Informations complémentaires",
      registration_submit: "Soumettre ma candidature",
      registration_reset: "Effacer",
      lang_french: "Français",
      lang_english: "English",
      program_family: "Renforcement des liens familiaux",
      program_fathers: "Repère des Pères",
      program_mothers: "Mamans & Savoirs",
      program_soccer: "Football en Français",
      program_talent: "Franc'Ô Talent",
      program_mediation: "Médiation famille-école",
      sending: "Envoi en cours...",
      success: "✅ Inscription envoyée ! Nous vous contacterons bientôt.",
      error: "❌ Erreur. Veuillez réessayer.",
      network_error: "❌ Problème de connexion. Vérifiez votre réseau.",
      info_registering_for: "ℹ️ Vous êtes en train de vous inscrire à :"
    },
    en: {
      registration_eyebrow: "Registration",
      registration_title: "Registration Space",
      registration_intro: "Sign up for FAFF activities and programs.",
      registration_name: "Full name",
      registration_email: "Email",
      registration_phone: "Phone",
      registration_program: "Program / Event",
      registration_choose_program: "Choose a program or event",
      registration_date: "Preferred date",
      registration_preferred_lang: "Preferred language",
      registration_infos: "Additional information",
      registration_submit: "Submit my application",
      registration_reset: "Clear",
      lang_french: "Français",
      lang_english: "English",
      program_family: "Family strengthening",
      program_fathers: "Fathers' Corner",
      program_mothers: "Mothers & Knowledge",
      program_soccer: "Football in French",
      program_talent: "Franc'Ô Talent",
      program_mediation: "School-family mediation",
      sending: "Sending...",
      success: "✅ Registration sent! We will contact you soon.",
      error: "❌ Error. Please try again.",
      network_error: "❌ Connection problem. Check your network.",
      info_registering_for: "ℹ️ You are registering for:"
    }
  };

  // Récupérer la langue courante
  function getCurrentLang() {
    return localStorage.getItem('faff_lang') || 'fr';
  }

  // Fonction de traduction
  function t(key) {
    const lang = getCurrentLang();
    if (inscriptionTranslations[lang] && inscriptionTranslations[lang][key]) {
      return inscriptionTranslations[lang][key];
    }
    return inscriptionTranslations.fr[key] || key;
  }

  // Mettre à jour toute l'interface
  function updateUILanguage() {
    const elements = document.querySelectorAll('[data-i18n]');
    elements.forEach(el => {
      const key = el.getAttribute('data-i18n');
      const translation = t(key);
      if (translation !== key) {
        if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'email' || el.type === 'tel')) {
          el.placeholder = translation;
        } else if (el.tagName === 'TEXTAREA') {
          el.placeholder = translation;
        } else if (el.tagName === 'OPTION') {
          el.textContent = translation;
        } else {
          el.textContent = translation;
        }
      }
    });
    updateInfoMessage();
  }

  function refreshBanner() {
    const bannerDiv = document.getElementById('hero-bg-image');
    if (bannerDiv) {
      const timestamp = new Date().getTime();
      bannerDiv.style.backgroundImage = `url('/images/inscription-banner.png?t=${timestamp}')`;
    }
  }

  function showMessage(text, isError = false) {
    const msgDiv = document.getElementById('inscription-message');
    msgDiv.textContent = text;
    msgDiv.style.display = 'block';
    msgDiv.style.backgroundColor = isError ? '#fee2e2' : '#e6f7e6';
    msgDiv.style.color = isError ? '#c62828' : '#2e7d32';
    msgDiv.style.border = isError ? '1px solid #ffcdd2' : '1px solid #c8e6c9';
    
    setTimeout(() => {
      msgDiv.style.opacity = '0';
      setTimeout(() => {
        msgDiv.style.display = 'none';
        msgDiv.style.opacity = '1';
      }, 500);
    }, 5000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Récupérer les paramètres de l'URL
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      event_name: params.get('event_name'),
      event_id: params.get('event_id'),
      programme: params.get('programme')
    };
  }

  // Mettre à jour le message d'information
  function updateInfoMessage() {
    const params = getUrlParams();
    const eventName = params.event_name || params.programme;
    const infoDiv = document.getElementById('event-info-message');
    
    if (infoDiv && eventName) {
      infoDiv.innerHTML = `${t('info_registering_for')} <strong>${escapeHtml(eventName)}</strong>`;
    }
  }

  // Pré-remplir le champ programme (champ ACTIF - pas disabled)
  function prefillEventName() {
    const params = getUrlParams();
    const eventName = params.event_name || params.programme;
    
    if (eventName) {
      const programmeSelect = document.getElementById('programme-select');
      
      // Vérifier si l'événement existe déjà dans la liste
      let optionExists = false;
      for (let i = 0; i < programmeSelect.options.length; i++) {
        if (programmeSelect.options[i].value === eventName) {
          optionExists = true;
          break;
        }
      }
      
      // Si l'événement n'existe pas, l'ajouter
      if (!optionExists && eventName) {
        const newOption = document.createElement('option');
        newOption.value = eventName;
        newOption.textContent = eventName;
        programmeSelect.appendChild(newOption);
      }
      
      // Sélectionner l'événement (champ RESTE ACTIF pour que la valeur soit envoyée)
      programmeSelect.value = eventName;
      // PAS de disabled !!!
      
      // Ajouter un message d'information
      if (!document.getElementById('event-info-message') && eventName) {
        const infoDiv = document.createElement('div');
        infoDiv.id = 'event-info-message';
        infoDiv.className = 'info-message';
        infoDiv.innerHTML = `${t('info_registering_for')} <strong>${escapeHtml(eventName)}</strong>`;
        
        const parentDiv = programmeSelect.parentElement;
        parentDiv.appendChild(infoDiv);
      }
    }
  }

  // Initialisation du formulaire
  const inscriptionForm = document.getElementById('inscription-form');
  if (inscriptionForm) {
    inscriptionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const msgDiv = document.getElementById('inscription-message');
      const submitBtn = inscriptionForm.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.textContent;
      
      // Désactiver le bouton pendant l'envoi
      submitBtn.disabled = true;
      submitBtn.textContent = t('sending');
      
      msgDiv.style.display = 'block';
      msgDiv.textContent = t('sending');
      msgDiv.style.backgroundColor = '#e3f2fd';
      msgDiv.style.color = '#1565c0';
      msgDiv.style.border = '1px solid #bbdefb';
      
      const formData = new FormData(e.target);
      const data = {
        nom: formData.get('nom'),
        email: formData.get('email'),
        programme: formData.get('programme'),
        date_souhaitee: formData.get('date_souhaitee') || null,
        infos: formData.get('infos') || null
      };
      
      console.log('📤 Envoi inscription:', data);
      
      try {
        const response = await fetch('/api/inscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        console.log('📥 Réponse:', result);
        
        if (response.ok && result.success) {
          showMessage(t('success'), false);
          inscriptionForm.reset();
          // Re-préremplir après reset
          prefillEventName();
        } else {
          showMessage(result.error || t('error'), true);
        }
      } catch (error) {
        console.error('❌ Erreur:', error);
        showMessage(t('network_error'), true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
      }
    });

    const resetBtn = inscriptionForm.querySelector('button[type="reset"]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        const msgDiv = document.getElementById('inscription-message');
        msgDiv.style.display = 'none';
        // Re-préremplir après reset
        setTimeout(() => prefillEventName(), 10);
      });
    }
  }

  // Écouter les changements de langue
  document.addEventListener('languageChanged', (e) => {
    updateUILanguage();
    updateInfoMessage();
  });

  document.addEventListener('DOMContentLoaded', () => {
    refreshBanner();
    updateUILanguage();
    prefillEventName();
    
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshBanner();
    });
  });
</script>

</body>
</html>
